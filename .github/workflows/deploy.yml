name: Deploy docs to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci
        working-directory: docs

      - name: Debug environment
        run: |
          echo "GITHUB_ACTIONS=$GITHUB_ACTIONS"
          echo "CI=$CI"
          echo "NODE_ENV=$NODE_ENV"
          echo "BASE will be: $(node -e 'console.log(process.env.CI === "true" || process.env.GITHUB_ACTIONS === "true" ? "/Mai_catgirl" : "/")')"
        working-directory: docs

      - name: Build site
        run: npm run build
        working-directory: docs
        env:
          GITHUB_ACTIONS: 'true'
          CI: 'true'

      - name: Show built files
        run: |
          ls -la dist/
          echo "---"
          grep -o 'href="[^"]*install[^"]*"' dist/index.html || echo "install link not found"
        working-directory: docs

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
